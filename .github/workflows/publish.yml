name: Publish Maven Package to GitHub Packages

on:
  workflow_dispatch:  # allows manual run from GitHub UI

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:

      # Checkout ONLY the current branch state
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1   # ensures it only uses current branch files

      # Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      # Configure Maven settings.xml with GitHub Packages credentials
      - name: Configure Maven for GitHub Packages
        uses: s4u/maven-settings-action@v4
        with:
          servers: |
            [
              {
                "id": "github",
                "username": "${{ github.actor }}",
                "password": "${{ secrets.GITHUB_TOKEN }}"
              }
            ]

      # Build the project
      - name: Build with Maven
        run: mvn -B clean verify -Pgithub

      # Deploy to GitHub Packages
      - name: Deploy to GitHub Packages
        run: mvn -B deploy -Pgithub
