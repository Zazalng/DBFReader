name: Publish Javadocs

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish Maven Package"]
    types:
      - completed

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate_and_publish_javadocs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Javadocs (run verify to ensure plugin executions)
        run: mvn -B verify -Pgithub

      - name: Locate Javadocs (check common locations)
        id: find-javadoc
        run: |
          echo "Checking expected javadoc paths..."
          if [ -d "target/site/apidocs" ]; then
            echo "path=target/site/apidocs" >> $GITHUB_OUTPUT
            echo "Found target/site/apidocs"
          elif [ -d "target/reports/apidocs" ]; then
            echo "path=target/reports/apidocs" >> $GITHUB_OUTPUT
            echo "Found target/reports/apidocs"
          else
            echo "No Javadoc directory found. Listing target tree for debug:"
            ls -al target || true
            echo "##[error]Javadoc not generated. Checked: target/site/apidocs and target/reports/apidocs"
            exit 1
          fi

      - name: Upload Pages Artifact (Javadocs)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find-javadoc.outputs.path }}

  deploy_pages:
    needs: generate_and_publish_javadocs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
