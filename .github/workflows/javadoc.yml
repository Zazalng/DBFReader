name: Publish Javadoc

on:
  release:
    types: [published]
  workflow_dispatch:  # allows manual trigger from Actions tab

jobs:
  javadoc:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required for gh-pages deployment

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Javadoc
        run: mvn -B clean javadoc:javadoc

      - name: Prepare documentation for publishing
        run: |
          VERSION=${GITHUB_REF##*/}
          echo "Detected version: $VERSION"
          mkdir -p publish/$VERSION
          cp -r target/site/apidocs/* publish/$VERSION/
          # Copy same content to /latest for easy reference
          mkdir -p publish/latest
          cp -r target/site/apidocs/* publish/latest/
          # Add redirect from root
          echo "<meta http-equiv='refresh' content='0; url=latest/index.html'>" > publish/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./publish
          commit_message: "Publish Javadoc for ${{ github.event.release.tag_name }}"
