name: Publish Maven Package + Javadocs

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build & Publish to GitHub Packages
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      pages: write
      id-token: write

    steps:
      - name: Checkout (current branch only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Configure Maven for GitHub Packages
        uses: s4u/maven-settings-action@v4.0.0
        with:
          servers: |
            [
              {
                "id": "github",
                "username": "${{ github.actor }}",
                "password": "${{ secrets.GITHUB_TOKEN }}"
              }
            ]

      - name: Build Project
        run: mvn -B clean verify -Pgithub

      - name: Deploy to GitHub Packages
        run: mvn -B deploy -Pgithub


  publish-javadocs:
    name: Publish Javadoc to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-and-publish

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout (current branch only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Javadocs
        run: mvn -B javadoc:javadoc

      - name: Upload Javadoc to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/apidocs

  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: publish-javadocs

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
