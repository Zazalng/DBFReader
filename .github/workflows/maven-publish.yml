name: Maven Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    name: Build (and run tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build with Maven
        run: mvn -B -V clean verify

  release:
    name: Release to Sonatype OSSRH (runs on tag)
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
      OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Import GPG private key
        run: |
          set -e
          # Create GNUPGHOME to avoid interfering with runner
          export GNUPGHOME="$RUNNER_WORKSPACE/.gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          # Import the private key
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Allow loopback pinentry so Maven GPG plugin can use passphrase
          echo "allow-loopback-pinentry" >> "$GNUPGHOME/gpg-agent.conf"
          # Restart gpg-agent (best-effort)
          if gpgconf --list-dirs >/dev/null 2>&1; then
            gpgconf --kill all || true
          fi

      - name: Prepare Maven settings.xml with Sonatype credentials
        shell: bash
        run: |
          set -e
          # Compose Authorization header expected by the Central Portal Publisher API
          AUTH="Bearer $(printf "%s:%s" "$OSSRH_USERNAME" "$OSSRH_PASSWORD" | base64 -w 0)"
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>central</id>
                <configuration>
                  <httpHeaders>
                    <property>
                      <name>Authorization</name>
                      <value>${AUTH}</value>
                    </property>
                  </httpHeaders>
                </configuration>
              </server>
            </servers>
          </settings>
          EOF

      - name: Deploy to OSSRH (release profile)
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -e
          mvn -B -P release clean deploy --settings "$HOME/.m2/settings.xml"

      - name: Print release hint
        run: echo "Release job finished (if Maven deploy succeeded, bundle was uploaded). Check Sonatype UI for deployment status."

